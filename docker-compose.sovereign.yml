# BEEP sovereign stack — self-hosted Appwrite + auxiliary services (Ollama/LiteLLM/MCP from docker-compose.yml).
#
# Prerequisites:
#   1. bun run appwrite:bootstrap  (wizard → writes ./appwrite/docker-compose.yml + .env)
#   2. docker compose -f docker-compose.sovereign.yml config
#
# Appwrite is the BaaS plane (auth, TablesDB, Sites, Functions). Inference stays host-managed per docs/edge/deployment-profile.md.

name: beep-sovereign

include:
  - path: ./appwrite/docker-compose.yml
    env_file:
      - ./appwrite/.env
  - path: ./docker-compose.yml
